# Dev compose stack for my-money.
#
# Profiles:
#   - (default) `postgres`, `redis` — the data services every mode needs.
#   - `dev` adds `postgres_test`, the Vitest database (PLAN19 P19-33). `make up`
#     passes it; a production deploy does not, so the test database no longer
#     starts on the home server.
#   - `prod` adds `app`, `worker` and `cloudflared` — for running the full
#     stack from built images, e.g., on the home server.
#
# Usage:
#   docker compose -f docker/compose.yaml --profile dev up -d   # dev: postgres + test postgres + redis
#   docker compose -f docker/compose.yaml --profile prod up -d  # production: everything but the test DB
#
# Per ADR-002 and CLAUDE.md: Postgres is NOT exposed to the host network in production.
# In dev, we publish 5432/6379 to localhost so `pnpm dev` and `drizzle-kit` can reach them.

name: my-money

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-money}
    ports:
      # Dev-only: expose to host so drizzle-kit + pnpm dev can reach it.
      # Mapped to 5433 to avoid collisions with any existing host Postgres on 5432.
      # The prod profile (P0-14) should bind only to the docker network.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money} -d ${POSTGRES_DB:-money}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - money_net

  # Dedicated Postgres for the Vitest suite. The test specs TRUNCATE shared
  # tables to achieve isolation — pointing them at the dev DB wipes real data.
  # This service runs alongside the dev DB on a separate port + volume so
  # `npm test` can never touch development data again. Wired via
  # TEST_DATABASE_URL in .env.local; vitest.setup.ts overrides DATABASE_URL
  # to point here.
  postgres_test:
    # Dev/test only. Without a profile it also started under `--profile prod`,
    # with its own volume and RAM, on a Raspberry Pi that never runs the suite.
    profiles: ["dev"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-money_test}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money} -d ${POSTGRES_TEST_DB:-money_test}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - money_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      # Mapped to 6380 to avoid collisions with any existing host Redis on 6379.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - money_net

  # ── Application services (prod profile) ────────────────────────────────────
  # Activate with: docker compose --profile prod up
  # In production we do NOT publish Postgres/Redis to the host — the app and
  # worker reach them via the docker network only.

  app:
    profiles: ["prod"]
    # Defaults to the prebuilt multi-arch image on Docker Hub — no build/clone on
    # the server. Pin a specific git-SHA tag with MONEY_IMAGE_TAG in .env; defaults
    # to `latest`. To run an image you built yourself from this source instead, set
    # MONEY_IMAGE_REPO (and MONEY_IMAGE_TAG) in .env — see docs/DEPLOY.md
    # §Prerequisites, "Path B" (PLAN19 P19-05, ADR-050).
    image: ${MONEY_IMAGE_REPO:-robermar2/my-money}:${MONEY_IMAGE_TAG:-latest}
    restart: unless-stopped
    # `exec node server.js`, the image's own CMD, unless MONEY_AUTO_MIGRATE is
    # exactly "true" — then pending migrations are applied first (PLAN19 P19-21,
    # ADR-054 §4). Off by default; read scripts/app-start.sh before turning it on.
    command: ["sh", "./scripts/app-start.sh"]
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-money}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MONEY_ENCRYPTION_KEY: ${MONEY_ENCRYPTION_KEY:?MONEY_ENCRYPTION_KEY is required}
      # Session cookie `Secure` flag. Default off so LAN access over plain HTTP
      # (http://<host>:4000) works — a Secure cookie is dropped by browsers over
      # http, which silently breaks login (re-prompts every navigation). Set to
      # `true` only if you reach the app exclusively over HTTPS (e.g. via the
      # Cloudflare tunnel).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Shown on /settings/instance so a support request can quote the image in
      # use (PLAN19 P19-10). Same defaults as `image:` above; neither is a secret.
      MONEY_IMAGE_REPO: ${MONEY_IMAGE_REPO:-robermar2/my-money}
      MONEY_IMAGE_TAG: ${MONEY_IMAGE_TAG:-latest}
      # Opt-in, default off: migrate the database on every app start, unattended
      # and with no backup step. Settings → Instance warns while it is on.
      MONEY_AUTO_MIGRATE: ${MONEY_AUTO_MIGRATE:-false}
      # The operator's time zone (PLAN19 P19-24), same value as the worker's.
      # Here it only changes how /settings/instance describes the schedule.
      TZ: ${MONEY_TZ:-}
      # Plaid (Phase 4+). Empty defaults so a manual-only deploy starts fine; the
      # Plaid client validates lazily and only errors when a Plaid feature is
      # actually used (Link, webhook processing, sync jobs). PLAID_WEBHOOK_URL is
      # baked into newly-minted link tokens — set it once the tunnel is up (§4).
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
    ports:
      # Bind only to localhost; the public webhook path is exposed via the
      # Cloudflare Tunnel sidecar below (ADR-010, P4-29). The home router stays
      # closed — see docs/DEPLOY.md §3.
      - "127.0.0.1:4000:4000"
    # P6-22: liveness via the in-app /api/health probe (DB + Redis). Uses Node's
    # global fetch so we need no curl/wget in the image (curl is purged after the
    # build). `start_period` gives the standalone server time to boot before
    # failures count against the restart policy.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - money_net

  worker:
    profiles: ["prod"]
    # Same published image as `app` (shared codebase, different entrypoint via the
    # `command` below). Pin with MONEY_IMAGE_TAG in .env; defaults to `latest`.
    # MONEY_IMAGE_REPO overrides the repository for both services at once.
    image: ${MONEY_IMAGE_REPO:-robermar2/my-money}:${MONEY_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Mirror package.json's `worker` script: `--import tsx` for TS, and
    # `--import ./scripts/loaders/register.mjs` to stub Next's `server-only`
    # marker (not a real installed package — it only resolves inside Next's
    # bundler). Without the stub, worker job modules that carry `server-only`
    # (e.g. src/lib/holdings/value.ts) crash the process with ERR_MODULE_NOT_FOUND.
    command:
      [
        "node",
        "--experimental-strip-types",
        "--import",
        "tsx",
        "--import",
        "./scripts/loaders/register.mjs",
        "src/worker/index.ts",
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-money}
      REDIS_URL: redis://redis:6379
      MONEY_ENCRYPTION_KEY: ${MONEY_ENCRYPTION_KEY:?MONEY_ENCRYPTION_KEY is required}
      # Plaid (Phase 4+): the worker runs the sync jobs and the in-container
      # set-webhook-url maintenance script (§4). Empty defaults — lazy-validated.
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      # Phase 6 (P6-06, ADR-014): nightly encrypted backup. Recipient is an age
      # PUBLIC key (safe here); empty/unset disables the backup job. The private
      # identity is NEVER on this box — it lives off-host (see docs/RESTORE.md).
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
      # Phase 6 (P6-10, ADR-016): nightly plain-text beancount mirror. Setting
      # the dir enables the export; it's a one-way readable copy of data already
      # in Postgres (not a secret). Replicate alongside the backups off-host.
      BEANCOUNT_DIR: /exports
      # The operator's time zone (PLAN19 P19-24), an IANA name such as
      # America/New_York; empty means UTC. Only the backup and the Beancount
      # export follow it. Prices, snapshots, the Plaid sync and alerts stay on
      # UTC, and every date the app stores stays a UTC date (src/worker/schedule.ts,
      # docs/DEPLOY.md §Time zone). Read from MONEY_TZ, not TZ, so a TZ exported
      # in the host's shell cannot leak in through compose interpolation.
      TZ: ${MONEY_TZ:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Encrypted dumps land here. Replicate this volume off-host (B2, rsync,
      # second disk) — that's the operator's responsibility per ADR-014.
      - backups:/backups
      # Plain-text beancount mirror (ADR-016). PLAINTEXT financial data — keep
      # the host path private; replicate off-host like the backups.
      - exports:/exports
    networks:
      - money_net

  # ── Public webhook ingress (P4-29, ADR-010) ────────────────────────────────
  # Cloudflare Tunnel sidecar. Plaid POSTs https://<your-domain>/api/plaid/webhook
  # → cloudflared (here) → app:4000/api/plaid/webhook (over money_net).
  #
  # No inbound ports are opened on the host — cloudflared dials OUT to
  # Cloudflare's edge and accepts traffic over that outbound tunnel. The home
  # router stays closed; TLS terminates at Cloudflare's edge.
  #
  # Token-mode tunnel: generate the token at
  #   https://one.dash.cloudflare.com → Networks → Tunnels → Create a tunnel
  # then set CLOUDFLARED_TOKEN in .env.local. See docs/DEPLOY.md for the
  # full ritual including the public hostname → http://app:4000 route mapping.
  cloudflared:
    profiles: ["prod"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # `--no-autoupdate` keeps cloudflared from restarting itself mid-webhook
    # delivery; we'd rather take updates via `docker compose pull`.
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN:-}"]
    environment:
      # Default to empty so data-only / dev compose commands (up, down, exec,
      # db-reset) don't trip on this prod-only var — compose interpolates every
      # service at parse time regardless of the active profile, so a required-
      # or-error (`:?`) form here aborts EVERY compose subcommand when the token
      # isn't set. With the prod profile actually selected, `cloudflared tunnel
      # run` fails loudly on an empty token, which is the fail-fast we want.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      app:
        condition: service_started
    networks:
      - money_net

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  # Encrypted nightly database backups (P6-06, ADR-014). Persisted across
  # container restarts; the operator replicates it off-host.
  backups:
  # Plain-text beancount mirror (P6-10, ADR-016). Persisted; replicate off-host.
  exports:

networks:
  money_net:
    driver: bridge
