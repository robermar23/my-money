# The slow gate (PLAN19 P19-18, ADR-054 §1): the Playwright critical flows,
# run by hand from the Actions tab. Kept out of ci.yml on purpose: it needs a
# browser, Postgres, Redis and a running dev server, and a gate that slow on
# every push would get skipped.
#
# Everything is ephemeral. The session secret and encryption key are generated
# per run and never stored. The Plaid specs talk to Plaid's sandbox only when
# the repository has PLAID_CLIENT_ID / PLAID_SECRET secrets set; they are
# sandbox credentials, never production ones.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).

name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: money
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money -d money"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CI: "true"
      DATABASE_URL: postgres://money:ci_only_not_a_secret@127.0.0.1:5432/money
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_TELEMETRY_DISABLED: "1"
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate per-run secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "MONEY_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Migrate
        run: pnpm db:migrate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
